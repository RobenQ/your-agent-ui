<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Agent Chat</title>
		<link rel="stylesheet" href="./css/index.css">
	</head>
	<body>

		<div class="header">
			<span class="title">🤖 Agent Chat</span>
			<div class="controls">
				<div class="protocol-group" id="protocolGroup">
					<button data-protocol="http" class="active">HTTP</button>
					<button data-protocol="sse">SSE</button>
					<button data-protocol="ws">WebSocket</button>
				</div>
				<button class="clear" onclick="clearChat()">清空对话</button>
			</div>
		</div>

		<div class="chat-container" id="chatContainer"></div>
		<div class="status-bar" id="statusBar">协议：HTTP</div>

		<div class="input-area">
			<textarea id="userInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
			<button id="sendBtn" onclick="sendMessage()">发送</button>
		</div>

		<script src="./js/index.js"></script>
	</body>
</html>
