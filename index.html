<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>your-agent</title>
	<link rel="stylesheet" href="./css/index.css">
</head>
<body>

<!-- 左侧：会话列表 -->
<aside class="sidebar">
	<div class="sidebar-header">
		<span>会话</span>
		<button class="new-session" id="newSessionBtn" title="新建会话" aria-label="新建会话">＋</button>
	</div>
	<div class="session-list" id="sessionList" role="list"></div>
</aside>

<!-- 右侧：主聊天区 -->
<main class="chat-main">
	<div class="header">
		<span class="title">🤖 your-agent</span>
		<div class="controls">
			<div class="protocol-group" id="protocolGroup" role="group" aria-label="通信协议">
				<button data-protocol="sse" class="active" aria-pressed="true">SSE</button>
				<button data-protocol="http" aria-pressed="false">HTTP</button>
				<button data-protocol="ws" aria-pressed="false">WebSocket</button>
			</div>
			<button class="clear" id="clearBtn">新建对话</button>
		</div>
	</div>

	<div class="chat-container" id="chatContainer" role="log" aria-live="polite"></div>
	<div class="status-bar" id="statusBar">协议：SSE</div>

	<div class="input-area">
		<textarea id="userInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行" aria-label="消息输入框"></textarea>
		<button id="sendBtn" aria-label="发送消息">发送</button>
	</div>
</main>

<script src="./js/markdown.js"></script>
<script src="./js/index.js"></script>
</body>
</html>
